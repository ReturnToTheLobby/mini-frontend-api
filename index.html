<!DOCTYPE html>
<html lang="ro">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Postari</h1>
        </header>

        <main class="container">
            <section class="form-section">
                <h2>Adaugă o postare nouă</h2>
                    <form id="post-form">
                        <div class="form-group">
                            <label for="title">Titlu:</label>
                            <input type="text" id="title" name="title" required minlength="3" placeholder="Introduceți titlul (min. 3 caractere)">
                        </div>
                        <div class="form-group">
                            <label for="body">Conținut:</label>
                            <textarea id="body" name="body" required rows="4" placeholder="Introduceți conținutul postării"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required placeholder="Introduceți adresa de email">
                        </div>
                        <button type="submit" id="submit-btn">Publică postarea</button>
                        <div id="form-message" class="message hidden" aria-live="polite"></div>
                    </form>
            </section>

            <section class="list-section">
                <div class="list-header">
                    <h2>Lista Postărilor</h2>
                    <input type="text" id="search-input" placeholder="Filtrează după titlu...">
                </div>

                <!-- Stări vizibile -->
                <div id="loading-state" class="state-box">Se încarcă datele...</div>
                <div id="error-state" class="state-box hidden">A apărut o eroare la preluarea datelor. Vă rugăm să încercați din nou.</div>
                <div id="empty-state" class="state-box hidden">Nu există postări disponibile.</div>

                <ul id="posts-list"></ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 - Mini-Frontend</p>
        </footer>
        </main>
    </body>
</html>
